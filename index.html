<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Aplicativos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <!-- Logo da empresa -->
    <img src="assets/images/code-innovation-apps-img.png" alt="Logo Code Innovation">
    <h1>Baixe nossos aplicativos</h1>
  </header>

  <div class="container">

  <!-- Card 1 - Minhas Despesas -->
  <div class="card">
    <img class="expenses" src="assets/images/expenses-icon.png" alt="Minhas Despesas">
    <h2>Minhas Despesas</h2>
    <a href="https://play.google.com/store/apps/details?id=br.com.codeinnovationapps.expenses" target="_blank">
      Baixar na Play Store

  <!-- Card 2 - Limpador de Som -->

    <img class="speaker-cleaner" src="assets/images/speaker-cleaner-icon.png" alt="Limpador de Som">

    <a href="https://play.google.com/store/apps/details?id=br.com.codeinnovationapps.speaker_cleaner" target="_blank">

    </a>

<!-- Card 3 - Beba Água -->
<div class="card">
  <img class="drink-water" src="assets/images/drink-water-icon.png" alt="Beba Água">
  <h2>Beba Água</h2>
  <a href="https://play.google.com/store/apps/details?id=br.com.codeinnovationapps.drink_water" target="_blank">
    Baixar na Play Store
  </a>
</div>

<!-- Card 4 - ObraSmart -->
<div class="card">
  <img class="obrasmart" src="assets/images/obrasmart-icon.png" alt="ObraSmart">
  <h2>ObraSmart</h2>
  <a href="https://play.google.com/store/apps/details?id=br.com.codeinnovationapps.obrasmart" target="_blank">
    Baixar na Play Store
  </a>

</div>

</html>
